<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm AI - Vision & Speech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Code Formatting Scripts & Styles -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <style>
        /* Fallback Styles if Tailwind fails */
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* Custom Styling for AI Code Blocks */
        .markdown-body pre {
            background-color: #161b22 !important;
            border: 1px solid #30363d;
            border-radius: 0.75rem;
            padding: 1.25rem 1rem 1rem 1rem;
            position: relative;
            margin: 0.75rem 0;
            overflow-x: auto;
            color: #e6edf3;
        }
        .markdown-body code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .markdown-body :not(pre) > code {
            background-color: rgba(110, 118, 129, 0.4);
            padding: 0.2rem 0.4rem;
            border-radius: 0.375rem;
            color: #38bdf8;
        }
        .code-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #21262d;
            padding: 4px 12px;
            border-radius: 6px 6px 0 0;
            margin: -1.25rem -1rem 0.75rem -1rem;
            border-bottom: 1px solid #30363d;
            font-size: 0.75rem;
            color: #8b949e;
        }
        .copy-code-btn {
            background: #30363d;
            color: #c9d1d9;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .copy-code-btn:hover {
            background: #484f58;
            color: #ffffff;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-slate-950 text-slate-100 overflow-hidden">

    <!-- Header Section -->
    <header class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-emerald-600 rounded-lg flex items-center justify-center text-white text-xs font-bold">W</div>
            <h1 class="text-sm font-semibold text-white">Worm AI Assistant</h1>
        </div>
        <div class="text-[11px] text-slate-400">
            Dev: <span class="text-emerald-400 font-medium">Ramzan Ahsan</span>
        </div>
    </header>

    <!-- Chat Messages View -->
    <main id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center my-auto">
            <div class="w-14 h-14 rounded-2xl bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-2xl mb-3">
                <i class="fa-solid fa-code"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Worm AI Chat & Code</h2>
            <p class="text-slate-400 text-xs mt-1">OCR Image Recognition, Voice & Markdown Formatting</p>
            <a href="https://chat.whatsapp.com/FiZBn0BykHX47d1iHLOay1" target="_blank" class="mt-3 px-3 py-1.5 bg-emerald-600/10 border border-emerald-500/30 rounded-lg text-emerald-400 text-xs flex items-center gap-1.5 hover:bg-emerald-600/20 transition">
                <i class="fa-brands fa-whatsapp"></i> Join WhatsApp Group
            </a>
        </div>
    </main>

    <!-- File Preview Strip -->
    <div id="attachment-preview" class="hidden px-4 max-w-4xl mx-auto w-full mb-1">
        <div class="inline-flex items-center gap-2 p-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-200">
            <i class="fa-solid fa-image text-emerald-400"></i>
            <span id="preview-filename" class="font-mono text-[11px] truncate max-w-[200px]">image.jpg</span>
            <button id="remove-file-btn" class="ml-1 text-slate-400 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <!-- Input Box Bar -->
    <div class="p-3 bg-slate-900 border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex items-center gap-2 bg-slate-950 border border-slate-800 focus-within:border-emerald-500 rounded-xl p-2">
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <button type="button" id="attach-btn" class="p-2 text-slate-400 hover:text-emerald-400 transition">
                <i class="fa-solid fa-paperclip text-base"></i>
            </button>
            
            <textarea id="user-input" rows="1" placeholder="Poochhein ya code mangein..." class="flex-1 bg-transparent text-slate-100 text-sm focus:outline-none resize-none px-2 py-1"></textarea>

            <button type="submit" id="send-btn" disabled class="px-3.5 py-1.5 bg-emerald-600/40 text-slate-400 rounded-lg flex items-center gap-1.5 text-xs font-semibold shrink-0 transition">
                <span id="send-btn-text">Send</span>
                <i id="send-btn-icon" class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script>
        const BASE_API = 'https://wormapi.vercel.app';
        let selectedFile = null;
        let currentAudio = null;
        let currentChatId = null;

        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const fileInput = document.getElementById('file-input');
        const attachBtn = document.getElementById('attach-btn');
        const sendBtn = document.getElementById('send-btn');
        const sendBtnText = document.getElementById('send-btn-text');
        const sendBtnIcon = document.getElementById('send-btn-icon');
        const attachmentPreview = document.getElementById('attachment-preview');
        const previewFilename = document.getElementById('preview-filename');
        const removeFileBtn = document.getElementById('remove-file-btn');
        const messagesContainer = document.getElementById('messages-container');
        const welcomeScreen = document.getElementById('welcome-screen');

        function updateSendButton() {
            const hasText = userInput.value.trim().length > 0;
            const hasFile = selectedFile !== null;
            if (hasText || hasFile) {
                sendBtn.disabled = false;
                sendBtn.className = "px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer rounded-lg flex items-center gap-1.5 text-xs font-semibold shrink-0 shadow-md transition";
            } else {
                sendBtn.disabled = true;
                sendBtn.className = "px-3.5 py-1.5 bg-emerald-600/40 text-slate-400 cursor-not-allowed rounded-lg flex items-center gap-1.5 text-xs font-semibold shrink-0 transition";
            }
        }

        userInput.addEventListener('input', updateSendButton);
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                previewFilename.textContent = selectedFile.name;
                attachmentPreview.classList.remove('hidden');
                updateSendButton();
            }
        });

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            attachmentPreview.classList.add('hidden');
            updateSendButton();
        });

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function playSpeech(speechUrl, btnElement) {
            const icon = btnElement.querySelector('i');
            
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                icon.className = "fa-solid fa-volume-high";
                return;
            }

            try {
                icon.className = "fa-solid fa-spinner fa-spin text-emerald-400";
                if (currentAudio) currentAudio.pause();

                currentAudio = new Audio(speechUrl);
                currentAudio.addEventListener('canplaythrough', () => {
                    icon.className = "fa-solid fa-pause text-emerald-400";
                    currentAudio.play();
                });
                currentAudio.addEventListener('ended', () => {
                    icon.className = "fa-solid fa-volume-high";
                });
                currentAudio.addEventListener('error', () => {
                    icon.className = "fa-solid fa-volume-xmark text-red-400";
                });
            } catch (err) {
                icon.className = "fa-solid fa-volume-xmark text-red-400";
            }
        }

        function copyCodeText(btn) {
            const pre = btn.closest('pre');
            const code = pre.querySelector('code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Copied!';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
                }, 2000);
            });
        }

        function formatMarkdownResponse(text) {
            const rawHtml = marked.parse(text);
            const wrapper = document.createElement('div');
            wrapper.className = 'markdown-body text-slate-100 text-sm';
            wrapper.innerHTML = rawHtml;

            wrapper.querySelectorAll('pre').forEach((pre) => {
                const codeBlock = pre.querySelector('code');
                let lang = 'code';
                if (codeBlock) {
                    const match = codeBlock.className.match(/language-(\w+)/);
                    if (match) lang = match[1];
                }

                const header = document.createElement('div');
                header.className = 'code-box-header';
                header.innerHTML = `
                    <span>${lang}</span>
                    <button type="button" class="copy-code-btn" onclick="copyCodeText(this)">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>`;
                pre.insertBefore(header, pre.firstChild);
            });

            return wrapper.outerHTML;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim() || "Kya lekha h";
            const fileToUpload = selectedFile;
            
            selectedFile = null;
            fileInput.value = '';
            userInput.value = '';
            attachmentPreview.classList.add('hidden');
            updateSendButton();

            sendBtn.disabled = true;
            sendBtnText.textContent = "Sending...";
            sendBtnIcon.className = "fa-solid fa-spinner fa-spin";

            if (welcomeScreen) welcomeScreen.remove();

            messagesContainer.innerHTML += `
                <div class="flex justify-end w-full">
                    <div class="max-w-[85%] bg-emerald-600 text-white p-3 rounded-2xl rounded-tr-none text-sm shadow-md">
                        ${fileToUpload ? `<div class="text-xs bg-emerald-700/80 p-1.5 rounded-lg mb-1.5 font-mono"><i class="fa-solid fa-paperclip"></i> ${fileToUpload.name}</div>` : ''}
                        <p class="whitespace-pre-wrap">${text}</p>
                    </div>
                </div>`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                let payload = { 
                    user_input: text, 
                    chat_id: currentChatId, 
                    attachments: [] 
                };

                if (fileToUpload) {
                    const base64 = await convertBase64(fileToUpload);
                    payload.attachments.push(base64);
                }

                const res = await fetch(`${BASE_API}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                
                if (data.chat_id) currentChatId = data.chat_id;

                const botReply = data.text_response || "No response received";
                const speechUrl = data.speech_url;

                let speechButtonHtml = speechUrl ? `
                    <button onclick="playSpeech('${speechUrl}', this)" class="mt-3 inline-flex items-center gap-1.5 px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs transition">
                        <i class="fa-solid fa-volume-high"></i>
                        <span>Listen Voice</span>
                    </button>` : '';

                const formattedContent = formatMarkdownResponse(botReply);

                messagesContainer.innerHTML += `
                    <div class="flex justify-start w-full">
                        <div class="flex items-start gap-2.5 max-w-[92%] w-full">
                            <div class="w-7 h-7 rounded-lg bg-emerald-600 flex items-center justify-center text-white text-xs mt-1 shrink-0">
                                <i class="fa-solid fa-robot"></i>
                            </div>
                            <div class="bg-slate-900 border border-slate-800 text-slate-100 p-3.5 rounded-2xl rounded-tl-none text-sm w-full overflow-hidden shadow-md">
                                ${formattedContent}
                                ${speechButtonHtml}
                            </div>
                        </div>
                    </div>`;
                
                Prism.highlightAll();
            } catch (err) {
                messagesContainer.innerHTML += `<div class="text-red-400 text-xs text-center p-2">Connection error. Please check your Vercel backend.</div>`;
            } finally {
                sendBtnText.textContent = "Send";
                sendBtnIcon.className = "fa-solid fa-paper-plane";
                updateSendButton();
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        });
    </script>
</body>
</html>
