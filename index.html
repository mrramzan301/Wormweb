<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm AI - Vision & Speech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="h-full font-sans flex flex-col md:flex-row overflow-hidden bg-slate-950">

    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-950">
        <!-- Messages Container -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center my-auto">
                <div class="w-16 h-16 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-2xl mb-4">
                    <i class="fa-solid fa-volume-high"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Worm AI Assistant</h2>
                <p class="text-slate-400 text-sm mt-1">Vision OCR, Speech & Chat Memory</p>
                <div class="mt-2 text-xs text-slate-300">
                    Developed by <strong class="text-emerald-400">Ramzan Ahsan</strong> | 
                    <a href="https://chat.whatsapp.com/FiZBn0BykHX47d1iHLOay1" target="_blank" class="text-emerald-400 underline hover:text-emerald-300">Join WhatsApp Group</a>
                </div>
            </div>
        </div>

        <!-- Attachment Preview -->
        <div id="attachment-preview" class="hidden px-4 max-w-4xl mx-auto w-full mb-2">
            <div class="inline-flex items-center gap-2 p-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200">
                <i class="fa-solid fa-file-image text-emerald-400"></i>
                <span id="preview-filename" class="font-mono text-[11px]">image.jpg</span>
                <button id="remove-file-btn" class="ml-2 text-slate-400 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-slate-950 border-t border-slate-900">
            <div class="max-w-4xl mx-auto relative">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                
                <form id="chat-form" class="bg-slate-900 border border-slate-800 focus-within:border-emerald-500 rounded-2xl p-2 flex items-center gap-2">
                    <button type="button" id="attach-btn" class="p-3 text-slate-400 hover:text-emerald-400 transition shrink-0">
                        <i class="fa-solid fa-paperclip text-lg"></i>
                    </button>
                    
                    <textarea id="user-input" rows="1" placeholder="Poochhein ya image attach karein..." class="flex-1 bg-transparent text-slate-100 text-sm focus:outline-none resize-none px-2 py-1"></textarea>

                    <button type="submit" id="send-btn" disabled class="px-4 py-2 bg-emerald-600/40 text-slate-400 rounded-xl flex items-center gap-2 text-xs font-semibold shrink-0 transition">
                        <span id="send-btn-text">Send</span>
                        <i id="send-btn-icon" class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const BASE_API = 'https://wormapi.vercel.app'; // Replace with your Vercel URL
        let selectedFile = null;
        let currentAudio = null;
        let currentChatId = null; // Stores ongoing chat session ID for context history

        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const fileInput = document.getElementById('file-input');
        const attachBtn = document.getElementById('attach-btn');
        const sendBtn = document.getElementById('send-btn');
        const sendBtnText = document.getElementById('send-btn-text');
        const sendBtnIcon = document.getElementById('send-btn-icon');
        const attachmentPreview = document.getElementById('attachment-preview');
        const previewFilename = document.getElementById('preview-filename');
        const removeFileBtn = document.getElementById('remove-file-btn');
        const messagesContainer = document.getElementById('messages-container');
        const welcomeScreen = document.getElementById('welcome-screen');

        function updateSendButton() {
            const hasText = userInput.value.trim().length > 0;
            const hasFile = selectedFile !== null;
            if (hasText || hasFile) {
                sendBtn.disabled = false;
                sendBtn.className = "px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer rounded-xl flex items-center gap-2 text-xs font-semibold shrink-0 shadow-md transition";
            } else {
                sendBtn.disabled = true;
                sendBtn.className = "px-4 py-2 bg-emerald-600/40 text-slate-400 cursor-not-allowed rounded-xl flex items-center gap-2 text-xs font-semibold shrink-0 transition";
            }
        }

        userInput.addEventListener('input', updateSendButton);
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                previewFilename.textContent = selectedFile.name;
                attachmentPreview.classList.remove('hidden');
                updateSendButton();
            }
        });

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            attachmentPreview.classList.add('hidden');
            updateSendButton();
        });

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function playSpeech(speechUrl, btnElement) {
            const icon = btnElement.querySelector('i');
            
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                icon.className = "fa-solid fa-volume-high";
                return;
            }

            try {
                icon.className = "fa-solid fa-spinner fa-spin text-emerald-400";
                
                if (currentAudio) {
                    currentAudio.pause();
                }

                currentAudio = new Audio(speechUrl);

                currentAudio.addEventListener('canplaythrough', () => {
                    icon.className = "fa-solid fa-pause text-emerald-400";
                    currentAudio.play();
                });

                currentAudio.addEventListener('ended', () => {
                    icon.className = "fa-solid fa-volume-high";
                });

                currentAudio.addEventListener('error', () => {
                    icon.className = "fa-solid fa-volume-xmark text-red-400";
                });

            } catch (err) {
                icon.className = "fa-solid fa-volume-xmark text-red-400";
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim() || "Kya lekha h";
            const fileToUpload = selectedFile;
            
            selectedFile = null;
            fileInput.value = '';
            userInput.value = '';
            attachmentPreview.classList.add('hidden');
            updateSendButton();

            sendBtn.disabled = true;
            sendBtnText.textContent = fileToUpload ? "Processing OCR..." : "Thinking...";
            sendBtnIcon.className = "fa-solid fa-spinner fa-spin";

            if (welcomeScreen) welcomeScreen.remove();

            messagesContainer.innerHTML += `
                <div class="flex justify-end w-full">
                    <div class="max-w-[80%] bg-emerald-600 text-white p-3 rounded-2xl rounded-tr-none text-sm">
                        ${fileToUpload ? `<div class="text-xs bg-emerald-700 p-1.5 rounded-lg mb-1 font-mono"><i class="fa-solid fa-paperclip"></i> ${fileToUpload.name}</div>` : ''}
                        <p>${text}</p>
                    </div>
                </div>`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                let payload = { 
                    user_input: text, 
                    chat_id: currentChatId, 
                    attachments: [] 
                };

                if (fileToUpload) {
                    const base64 = await convertBase64(fileToUpload);
                    payload.attachments.push(base64);
                }

                const res = await fetch(`${BASE_API}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                
                // Save returned chat_id to maintain memory
                if (data.chat_id) {
                    currentChatId = data.chat_id;
                }

                const botReply = data.text_response || "No response received";
                const speechUrl = data.speech_url;

                let speechButtonHtml = '';
                if (speechUrl) {
                    speechButtonHtml = `
                        <button onclick="playSpeech('${speechUrl}', this)" class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs transition">
                            <i class="fa-solid fa-volume-high"></i>
                            <span>Listen Voice</span>
                        </button>`;
                }

                messagesContainer.innerHTML += `
                    <div class="flex justify-start w-full">
                        <div class="flex items-start gap-3 max-w-[85%]">
                            <div class="w-8 h-8 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-xs mt-1 shrink-0">
                                <i class="fa-solid fa-robot"></i>
                            </div>
                            <div class="bg-slate-900 border border-slate-800 text-slate-100 p-4 rounded-2xl rounded-tl-none text-sm">
                                <div>${marked.parse(botReply)}</div>
                                ${speechButtonHtml}
                            </div>
                        </div>
                    </div>`;
            } catch (err) {
                messagesContainer.innerHTML += `<div class="text-red-400 text-xs text-center">Connection error. Check your API server.</div>`;
            } finally {
                sendBtnText.textContent = "Send";
                sendBtnIcon.className = "fa-solid fa-paper-plane";
                updateSendButton();
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        });
    </script>
</body>
</html>
