<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm AI - Developed by Ramzan Ahsan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
        .prose pre { background-color: #0f172a !important; padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid #1e293b; }
        .prose code { color: #38bdf8 !important; font-family: monospace; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.625; }
    </style>
</head>
<body class="h-full font-sans flex flex-col md:flex-row overflow-hidden bg-slate-950">

    <div class="md:hidden flex items-center justify-between p-3 border-b border-slate-800 bg-slate-900 z-20">
        <div class="flex items-center space-x-2">
            <button id="open-sidebar-btn" class="p-2 text-slate-300 hover:text-white">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <span class="font-bold text-lg bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">Worm AI</span>
        </div>
        <button id="mobile-new-chat-btn" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-semibold">
            <i class="fa-solid fa-plus"></i> New Chat
        </button>
    </div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-72 bg-slate-900 border-r border-slate-800 transform -translate-x-full md:translate-x-0 md:static transition-transform flex flex-col justify-between">
        <div class="p-4 border-b border-slate-800">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white">
                        <i class="fa-solid fa-bug text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-slate-100 text-base">Worm AI</h1>
                        <p class="text-[10px] text-emerald-400 uppercase font-medium">Vision Fixed Edition</p>
                    </div>
                </div>
                <button id="close-sidebar-btn" class="md:hidden text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <button id="new-chat-btn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl flex items-center justify-center space-x-2 text-sm">
                <i class="fa-solid fa-plus"></i>
                <span>Start New Chat</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-1">
            <div class="px-2 py-1 text-[11px] font-semibold text-slate-500 uppercase">Recent Conversations</div>
            <div id="chat-history-container" class="space-y-1"></div>
        </div>

        <div class="p-3.5 border-t border-slate-800 space-y-2">
            <a href="https://chat.whatsapp.com/FiZBn0BykHX47d1iHLOay1" target="_blank" class="w-full py-2 px-3 bg-slate-800 text-slate-200 rounded-lg text-xs flex items-center justify-between">
                <span class="flex items-center space-x-2"><i class="fa-brands fa-whatsapp text-emerald-400"></i><span>Join WhatsApp Group</span></span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-slate-400"></i>
            </a>
            <div class="pt-2 text-xs text-slate-400">
                <span class="text-[11px]">Developed by <strong class="text-emerald-400">Ramzan Ahsan</strong></span>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-950">
        <header class="hidden md:flex items-center justify-between px-6 py-3 border-b border-slate-800 bg-slate-900/40">
            <div class="flex items-center space-x-3">
                <span class="text-sm font-semibold text-slate-200">Session ID:</span>
                <span id="chat-id-text" class="px-2.5 py-1 bg-slate-800 text-emerald-400 font-mono text-xs rounded-md">New Chat</span>
            </div>
            <a href="https://chat.whatsapp.com/FiZBn0BykHX47d1iHLOay1" target="_blank" class="px-3 py-1.5 bg-emerald-950 text-emerald-300 text-xs rounded-lg flex items-center space-x-1 border border-emerald-500/30">
                <i class="fa-brands fa-whatsapp text-emerald-400 mr-1"></i> WhatsApp Group
            </a>
        </header>

        <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
            <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center px-4 max-w-2xl mx-auto my-auto">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white text-2xl shadow-xl mb-4">
                    <i class="fa-solid fa-bug"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Worm AI Assistant</h2>
                <p class="text-slate-400 text-sm max-w-md mb-6">Developed by <span class="text-emerald-400 font-semibold">Ramzan Ahsan</span>.</p>
            </div>
        </div>

        <div id="attachment-preview-container" class="hidden px-4 md:px-6 pt-2 max-w-4xl mx-auto w-full">
            <div class="inline-flex items-center gap-2 p-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 shadow-md">
                <span class="text-emerald-400"><i class="fa-solid fa-file-image text-sm"></i></span>
                <span id="preview-file-name" class="max-w-xs truncate font-mono text-[11px]">attachment.png</span>
                <button type="button" id="remove-attachment-btn" class="ml-2 text-slate-400 hover:text-red-400 p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <div class="p-4 md:p-6 bg-slate-950">
            <div class="max-w-4xl mx-auto relative">
                <input type="file" id="file-input" class="hidden" accept="image/*">

                <form id="chat-form" class="bg-slate-900 border border-slate-800 focus-within:border-emerald-500 rounded-2xl p-2 flex items-end space-x-2">
                    <button type="button" id="attach-btn" class="p-3 text-slate-400 hover:text-emerald-400 rounded-xl hover:bg-slate-800 transition shrink-0 cursor-pointer">
                        <i class="fa-solid fa-paperclip text-lg"></i>
                    </button>

                    <textarea id="user-input" rows="1" placeholder="Ask Worm AI or attach an image..." class="flex-1 bg-transparent text-slate-100 text-sm focus:outline-none resize-none max-h-32 py-2 px-1"></textarea>

                    <button type="submit" id="send-btn" disabled class="px-4 py-2.5 bg-emerald-600/40 text-slate-400 cursor-not-allowed rounded-xl flex items-center justify-center space-x-2 font-medium shrink-0 transition-all">
                        <span id="send-btn-text" class="text-xs font-semibold">Send</span>
                        <i id="send-btn-icon" class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
                <div class="flex items-center justify-between mt-2 px-2 text-[10px] text-slate-500">
                    <span>Press Enter to send • Shift + Enter for new line</span>
                    <span>Developed by <strong class="text-slate-400">Ramzan Ahsan</strong></span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentChatId = null;
        let chatSessions = JSON.parse(localStorage.getItem('worm_ai_sessions') || '[]');
        let currentMessages = [];
        let attachedFileObj = null;

        // Backend Deployment Domain
        const BASE_API = 'https://wormapi.vercel.app';

        const messagesContainer = document.getElementById('messages-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sendBtnText = document.getElementById('send-btn-text');
        const sendBtnIcon = document.getElementById('send-btn-icon');
        const fileInput = document.getElementById('file-input');
        const attachBtn = document.getElementById('attach-btn');
        const attachmentPreview = document.getElementById('attachment-preview-container');
        const previewFileName = document.getElementById('preview-file-name');
        const removeAttachmentBtn = document.getElementById('remove-attachment-btn');
        const chatIdText = document.getElementById('chat-id-text');
        const chatHistoryContainer = document.getElementById('chat-history-container');
        const sidebar = document.getElementById('sidebar');

        function updateSendButtonState() {
            const hasText = userInput.value.trim().length > 0;
            const hasFile = attachedFileObj !== null;

            if (hasText || hasFile) {
                sendBtn.disabled = false;
                sendBtn.className = "px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer rounded-xl flex items-center justify-center space-x-2 font-medium shrink-0 shadow-lg shadow-emerald-900/40 transition-all";
            } else {
                sendBtn.disabled = true;
                sendBtn.className = "px-4 py-2.5 bg-emerald-600/40 text-slate-400 cursor-not-allowed rounded-xl flex items-center justify-center space-x-2 font-medium shrink-0 transition-all";
            }
        }

        userInput.addEventListener('input', updateSendButtonState);
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            attachedFileObj = file;
            previewFileName.textContent = file.name;
            attachmentPreview.classList.remove('hidden');
            updateSendButtonState();
        });

        removeAttachmentBtn.addEventListener('click', () => {
            attachedFileObj = null;
            fileInput.value = '';
            attachmentPreview.classList.add('hidden');
            updateSendButtonState();
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function generateChatId() {
            return 'chat_' + Math.random().toString(36).substring(2, 9);
        }

        function initSession(id = null) {
            currentChatId = id || generateChatId();
            if (chatIdText) chatIdText.textContent = currentChatId;
            const existing = chatSessions.find(s => s.id === currentChatId);
            currentMessages = existing ? (existing.messages || []) : [];
            renderMessages();
            renderSidebarSessions();
        }

        function saveSessionToStorage() {
            if (!currentChatId) return;
            const existingIdx = chatSessions.findIndex(s => s.id === currentChatId);
            const title = currentMessages.find(m => m.role === 'user')?.text.slice(0, 30) || 'New Conversation';
            const sessionData = { id: currentChatId, title, messages: currentMessages, updatedAt: new Date().toISOString() };
            if (existingIdx >= 0) chatSessions[existingIdx] = sessionData;
            else chatSessions.unshift(sessionData);
            localStorage.setItem('worm_ai_sessions', JSON.stringify(chatSessions));
            renderSidebarSessions();
        }

        function renderSidebarSessions() {
            if (!chatHistoryContainer) return;
            chatHistoryContainer.innerHTML = '';
            chatSessions.forEach(session => {
                const isActive = session.id === currentChatId;
                const btn = document.createElement('div');
                btn.className = `flex items-center justify-between px-3 py-2 rounded-xl text-xs cursor-pointer ${isActive ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/30' : 'text-slate-400 hover:bg-slate-800'}`;
                btn.onclick = () => { currentChatId = session.id; initSession(session.id); };
                btn.innerHTML = `<span class="truncate">${session.title}</span>`;
                chatHistoryContainer.appendChild(btn);
            });
        }

        document.getElementById('new-chat-btn').onclick = () => initSession();
        document.getElementById('mobile-new-chat-btn').onclick = () => initSession();
        document.getElementById('open-sidebar-btn').onclick = () => sidebar.classList.remove('-translate-x-full');
        document.getElementById('close-sidebar-btn').onclick = () => sidebar.classList.add('-translate-x-full');

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function renderMessages() {
            if (currentMessages.length === 0) {
                messagesContainer.innerHTML = '';
                if (welcomeScreen) messagesContainer.appendChild(welcomeScreen);
                return;
            }
            messagesContainer.innerHTML = '';
            currentMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} w-full`;
                if (msg.role === 'user') {
                    div.innerHTML = `
                        <div class="max-w-[80%] bg-emerald-600 text-white p-3 rounded-2xl rounded-tr-none text-sm">
                            ${msg.fileName ? `<div class="text-xs bg-emerald-700/80 p-1.5 rounded-lg mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-paperclip"></i> <span class="truncate">${msg.fileName}</span></div>` : ''}
                            <p class="whitespace-pre-wrap">${msg.text}</p>
                        </div>`;
                } else {
                    const htmlContent = marked.parse(msg.text || '');
                    div.innerHTML = `
                        <div class="flex items-start space-x-3 max-w-[85%]">
                            <div class="w-8 h-8 rounded-xl bg-emerald-600 flex items-center justify-center text-white shrink-0 text-xs mt-1">
                                <i class="fa-solid fa-bug"></i>
                            </div>
                            <div class="bg-slate-900 border border-slate-800 text-slate-100 p-4 rounded-2xl rounded-tl-none prose prose-invert prose-sm max-w-none">
                                ${htmlContent}
                                ${msg.audio ? `<div class="mt-2 pt-2 border-t border-slate-800"><button onclick="new Audio('${msg.audio}').play()" class="text-xs text-emerald-400 hover:text-emerald-300 flex items-center gap-1"><i class="fa-solid fa-volume-high"></i> Listen</button></div>` : ''}
                            </div>
                        </div>`;
                }
                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim() || "Is image me kya likha hai?";
            const fileToUpload = attachedFileObj;
            const fileName = attachedFileObj ? attachedFileObj.name : '';

            // Reset Input UI
            attachedFileObj = null;
            fileInput.value = '';
            userInput.value = '';
            attachmentPreview.classList.add('hidden');

            sendBtn.disabled = true;
            sendBtnText.textContent = "Processing...";
            sendBtnIcon.className = "fa-solid fa-spinner fa-spin text-xs";

            currentMessages.push({ role: 'user', text: text, fileName });
            renderMessages();

            try {
                let attachmentPayload = [];

                if (fileToUpload) {
                    sendBtnText.textContent = "Reading Image...";
                    const base64Data = await fileToBase64(fileToUpload);
                    attachmentPayload.push(base64Data);
                }

                sendBtnText.textContent = "Analyzing...";
                const chatRes = await fetch(`${BASE_API}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_input: text,
                        chat_id: currentChatId,
                        attachments: attachmentPayload
                    })
                });

                const chatJson = await chatRes.json();
                const botResponse = chatJson.text_response || "No response received";
                const speechUrl = chatJson.speech_url || "";

                currentMessages.push({ role: 'assistant', text: botResponse, audio: speechUrl });
                saveSessionToStorage();

            } catch (err) {
                currentMessages.push({ role: 'assistant', text: "Error connecting to AI service." });
            } finally {
                sendBtnText.textContent = "Send";
                sendBtnIcon.className = "fa-solid fa-paper-plane text-xs";
                renderMessages();
                updateSendButtonState();
            }
        });

        window.onload = () => initSession();
    </script>
</body>
</html>
